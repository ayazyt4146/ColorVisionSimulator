name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'
      - name: Build phone and tablet APKs
        run: |
          gradle --version
          gradle assemblePhoneDebug assembleTabletDebug
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk ColorVisionSimulator-Phone.apk
          cp app/build/outputs/apk/tablet/debug/app-tablet-debug.apk ColorVisionSimulator-Tablet.apk
      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Color Vision Simulator v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            ColorVisionSimulator-Phone.apk
            ColorVisionSimulator-Tablet.apk
